
name: GitLeaks Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Gitleaks scan
        shell: bash
        run: |
          GL_VERSION=8.29.1
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks

          ./gitleaks detect \
            --no-git \
            --report-format json \
            --report-path gitleaks.json

          echo "Fingerprints:"
          jq -r '.[].Fingerprint' gitleaks.json || true

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks.json
          path: gitleaks.json
          if-no-files-found: ignore
