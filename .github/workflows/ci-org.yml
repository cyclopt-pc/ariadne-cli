name: CI Pipeline
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  testing:
    needs: gitleaks
    uses: ./.github/workflows/testing.yml
    secrets: inherit

  release:
    needs: [gitleaks, testing]
    if: |
      always() &&
      (github.ref == 'refs/heads/main') &&
      (needs.testing.result == 'success' && needs.gitleaks.result == 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit