name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bash scripts/build.sh
      - run: ./dist/ariadne-linux-x64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: build-smoke
          path: dist/SHA256SUMS
